[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghdl-gui"
version = "0.1.0"
description = "Plattformunabhaengige grafische Oberflaeche fuer GHDL (VHDL-Simulator)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6,<7",
]

[project.scripts]
ghdl-gui = "ghdl_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
